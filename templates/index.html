
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="mb-2">Network Scanner</h2>
    <p class="text-muted">Monitoring perangkat jaringan lokal</p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>Informasi Jaringan</h5>
            <div id="networkInfo">Memuat informasi jaringan...</div>

            <button class="btn btn-primary mt-3"
                    onclick="startScan()">
                Scan Network
            </button>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <p class="text-muted">Total Perangkat</p>
                    <h2 id="totalDevices">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5>Daftar Perangkat</h5>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>IP Address</th>
                            <th>MAC Address</th>
                            <th>Hostname</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="deviceTable">
                        <tr>
                            <td colspan="5" class="text-center">
                                Belum ada data scan
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
async function loadNetworkInfo() {
    try {
        const response = await fetch("/api/network-info");
        const result = await response.json();

        if (!result.success) {
            throw new Error(result.message);
        }

        const data = result.data;

        document.getElementById("networkInfo").innerHTML = `
            <p>Interface: ${data.interface}</p>
            <p>IP Address: ${data.ip_address}</p>
            <p>Netmask: ${data.netmask}</p>
            <p>Network: ${data.network}</p>
        `;

    } catch (error) {
        document.getElementById("networkInfo").textContent =
            "Error: " + error.message;
    }
}


async function startScan() {
    const button = document.querySelector("button");

    button.disabled = true;
    button.textContent = "Scanning...";

    try {
        const response = await fetch("/api/scan", {
            method: "POST"
        });

        const result = await response.json();

        if (!result.success) {
            throw new Error(result.message);
        }

        const data = result.data;

        document.getElementById("totalDevices").textContent =
            data.total_devices;

        const table = document.getElementById("deviceTable");

        table.innerHTML = "";

        if (data.devices.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center">
                        Tidak ditemukan perangkat
                    </td>
                </tr>
            `;
        }

        data.devices.forEach((device, index) => {
            const row = document.createElement("tr");

            [
                index + 1,
                device.ip_address,
                device.mac_address,
                device.hostname,
                device.status
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            table.appendChild(row);
        });

    } catch (error) {
        alert("Scan gagal: " + error.message);
    } finally {
        button.disabled = false;
        button.textContent = "Scan Network";
    }
}

loadNetworkInfo();
</script>

</body>
</html>
